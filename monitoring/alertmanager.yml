global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity', 'chain_id']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'telegram'

  routes:
    # Critical alerts - immediate notification
    - match:
        severity: critical
      receiver: 'telegram'
      repeat_interval: 1h

    # Warning alerts
    - match:
        severity: warning
      receiver: 'telegram'
      repeat_interval: 4h

receivers:
  - name: 'telegram'
    telegram_configs:
      - bot_token: 'PLACEHOLDER_TELEGRAM_BOT_TOKEN'
        chat_id: PLACEHOLDER_TELEGRAM_CHAT_ID
        parse_mode: 'HTML'
        message: |
          {{ if eq .Status "firing" }}🚨{{ else }}✅{{ end }} <b>{{ .Status | toUpper }}</b>

          {{ range .Alerts }}
          <b>{{ .Labels.alertname }}</b>
          Severity: {{ .Labels.severity }}
          {{ .Annotations.description }}

          {{ end }}

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname']
